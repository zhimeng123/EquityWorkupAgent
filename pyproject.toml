[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mlc-workup-agent"
version = "0.1.0"
description = "A-share company data collection and fixed DOCX workup agent"
requires-python = ">=3.13,<3.14"
dependencies = [
  "beautifulsoup4==4.15.0",
  "httpx==0.28.1",
  "langgraph==1.2.7",
  "matplotlib==3.11.0",
  "openai==2.44.0",
  "pdfplumber==0.11.10",
  "pydantic==2.13.4",
  "python-docx==1.2.0",
  "python-dotenv==1.2.2",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]

[project.scripts]
mlc-agent = "mlc_agent.cli:main"

[tool.setuptools.packages.find]
include = ["mlc_agent*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
