[project]
name = "equity-workup-agent"
version = "0.1.0"
description = "Evidence-driven A-share equity workup Skill and deterministic tooling"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
render = ["pymupdf>=1.24"]
dev = ["pytest>=8", "ruff>=0.6", "pymupdf>=1.24"]

[tool.pytest.ini_options]
testpaths = [".agents/skills/equity-workup/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
