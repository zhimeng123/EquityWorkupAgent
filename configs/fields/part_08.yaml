fields:
  - field_id: ipo_date
    label: IPO Date
    source_type: annual_report
    locators:
      - kind: table_cell
        table_path:
          - table_index: 10
            row_index: 0
            column_index: 1
        expected_text: 可最新年报或半年报（选最新者）上抓取
    write_strategy: replace_text
    output_format: text

  - field_id: align_to_index
    label: Align to Index
    source_type: derived
    locators:
      - kind: table_cell
        table_path:
          - table_index: 10
            row_index: 3
            column_index: 1
        expected_text: Comments if no extra charge
    write_strategy: replace_text
    output_format: text

  - field_id: align_to_peers
    label: Align to Peers
    source_type: derived
    locators:
      - kind: table_cell
        table_path:
          - table_index: 10
            row_index: 3
            column_index: 3
        expected_text: Comments if no extra charge
    write_strategy: replace_text
    output_format: text

  - field_id: significant_stock_drop
    label: Significant Stock Drop in the Past 24 Months
    source_type: derived
    locators:
      - kind: table_cell
        table_path:
          - table_index: 11
            row_index: 0
            column_index: 2
        expected_text: 可在雪球网上取股价趋势图
