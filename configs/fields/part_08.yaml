        table_path:
          - table_index: 11
            row_index: 1
            column_index: 2
        expected_text: "If yes to the above, please provide full detail:"
    write_strategy: append_after_label
    output_format: text

  - field_id: securities_offerings
    label: Securities Offerings in the Past 12 Months
    source_type: cninfo
    locators:
      - kind: table_cell
        table_path:
          - table_index: 11
            row_index: 2
            column_index: 2
        expected_text: 可在最新年报和半年报上抓取
    write_strategy: replace_multiline_text
    output_format: multiline
